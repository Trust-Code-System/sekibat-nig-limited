name: sekibat-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sekibat
      POSTGRES_DB: sekibat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sekibat -d sekibat"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  postgres_data:
